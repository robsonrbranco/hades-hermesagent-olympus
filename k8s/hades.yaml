apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hades-data
  namespace: olympus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hades
  namespace: olympus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hades
  template:
    metadata:
      labels:
        app: hades
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: hades
          image: ghcr.io/robsonrbranco/hades-hermesagent:latest
          ports:
            - name: api
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          # API (8642) e dashboard (9119) vem DESLIGADOS por padrao na
          # imagem oficial -- so o "gateway" (mensageria+cron) sobe sozinho.
          # Descoberto no primeiro deploy (11/08/2026): porta reusava, curl
          # dava connection refused mesmo de dentro do proprio container.
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            # 0.0.0.0 de proposito: a API precisa ser alcancavel por outros
            # pods do cluster (Cerbero/Hermes) mais pra frente, via MCP. A
            # trava e a API_SERVER_KEY (secret hades-env), nao o bind.
            # ATENCAO (aviso do proprio app no log): com terminal.backend
            # local (default, nao sandboxado), qualquer chamada autenticada
            # nesse endpoint roda com acesso total ao terminal/filesystem do
            # container. Antes de conectar outro pod nele de verdade,
            # avaliar terminal.backend: docker (sandboxado) no config.yaml.
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            # Dashboard exposto publicamente via hades.ecomciencia.com atras
            # do Cloudflare Access (12/08/2026) -- por isso 0.0.0.0. O app
            # recusa bind publico sem auth propria: configuramos
            # dashboard.basic_auth (usuario/senha) direto no config.yaml
            # como segunda camada, redundante com o Access de proposito.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: hades-env
          volumeMounts:
            - name: data
              mountPath: /opt/data
          # Conservador de proposito: node do Olympus ja esta com limits em
          # ~106% de overcommit so com os apps existentes (ver memoria do
          # Claude Code / projeto). Ajustar com kubectl top depois de rodar
          # de verdade, mesmo processo usado pro Argos/Cerbero.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hades-data

---
apiVersion: v1
kind: Service
metadata:
  name: hades
  namespace: olympus
spec:
  selector:
    app: hades
  ports:
    - name: api
      port: 8642
      targetPort: 8642
    - name: dashboard
      port: 9119
      targetPort: 9119

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hades
  namespace: olympus
spec:
  rules:
    - host: hades.ecomciencia.com
      http:
        paths:
          # So o dashboard fica publico. A API (8642) continua acessivel so
          # de dentro do cluster (Service ClusterIP) -- ela roda comandos
          # com acesso total ao terminal/filesystem do container, exposicao
          # publica dela fica pra quando terminal.backend: docker
          # (sandboxado) estiver configurado.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hades
                port:
                  number: 9119
