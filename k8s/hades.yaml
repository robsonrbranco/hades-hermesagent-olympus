apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hades-data
  namespace: olympus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hades
  namespace: olympus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hades
  template:
    metadata:
      labels:
        app: hades
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: hades
          image: ghcr.io/robsonrbranco/hades-hermesagent:latest
          ports:
            - name: api
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          # API (8642) e dashboard (9119) vem DESLIGADOS por padrao na
          # imagem oficial -- so o "gateway" (mensageria+cron) sobe sozinho.
          # Descoberto no primeiro deploy (11/08/2026): porta reusava, curl
          # dava connection refused mesmo de dentro do proprio container.
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            # 0.0.0.0 de proposito: a API precisa ser alcancavel por outros
            # pods do cluster (Cerbero/Hermes) mais pra frente, via MCP. A
            # trava e a API_SERVER_KEY (secret hades-env), nao o bind.
            # ATENCAO (aviso do proprio app no log): com terminal.backend
            # local (default, nao sandboxado), qualquer chamada autenticada
            # nesse endpoint roda com acesso total ao terminal/filesystem do
            # container. Antes de conectar outro pod nele de verdade,
            # avaliar terminal.backend: docker (sandboxado) no config.yaml.
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            # Dashboard fica em loopback -- so alcancavel via kubectl
            # port-forward por enquanto (decisao: Control UI/CLI isolado,
            # sem expor ainda). Bind em 0.0.0.0 exige provedor de auth
            # configurado (dashboard.basic_auth ou OAuth no config.yaml),
            # que ainda nao fizemos.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "127.0.0.1"
          envFrom:
            - secretRef:
                name: hades-env
          volumeMounts:
            - name: data
              mountPath: /opt/data
          # Conservador de proposito: node do Olympus ja esta com limits em
          # ~106% de overcommit so com os apps existentes (ver memoria do
          # Claude Code / projeto). Ajustar com kubectl top depois de rodar
          # de verdade, mesmo processo usado pro Argos/Cerbero.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hades-data

---
apiVersion: v1
kind: Service
metadata:
  name: hades
  namespace: olympus
spec:
  selector:
    app: hades
  ports:
    - name: api
      port: 8642
      targetPort: 8642
    - name: dashboard
      port: 9119
      targetPort: 9119

# Sem Ingress de proposito por enquanto (decisao do Robson, 11/08/2026):
# Hades comeca isolado, so acessivel via `kubectl port-forward`, ate validar
# o comportamento dele antes de expor via cerbero.ecomciencia.com/Cloudflare
# Access. Quando for a hora, replicar o padrao de access.tf/dns.tf do
# infra-olympus (mesma trava: so robson.branco@gmail.com).
